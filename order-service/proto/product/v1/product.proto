syntax = "proto3";

package product.v1;

option go_package = "order-service/proto/product/v1";

service ProductService {
    rpc GetProduct(GetProductRequest)
        returns (GetProductResponse);

    // Atomically decrements stock for the given product by the requested
    // quantity. Returns the remaining stock, or an error if the product
    // does not exist or has insufficient stock.
    rpc ReserveStock(ReserveStockRequest)
        returns (ReserveStockResponse);
}

message GetProductRequest {
    uint64 product_id = 1;
}
message GetProductResponse {
    Product product = 1;
}

message ReserveStockRequest {
    uint64 product_id = 1;

    int32 quantity = 2;
}
message ReserveStockResponse {
    bool success = 1;

    int32 remaining_stock = 2;

    string message = 3;
}

message Product {
    uint64 id = 1;

    string name = 2;

    int64 price_minor = 3;

    string currency = 4;

    int32 stock = 5;

    string category = 6;

    string description = 7;
}