# Alert rules for distributed-service (optional, evaluated by Prometheus).

groups:
  - name: service_health
    interval: 30s
    rules:
      - alert: HighHttpErrorRate
        expr: |
          sum by (service_name) (rate(http_server_requests_total{status_code=~"5.."}[5m]))
            /
          sum by (service_name) (rate(http_server_requests_total[5m]))
            > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate on {{ $labels.service_name }}"
          description: "{{ $value | humanizePercentage }} of requests are failing."

      - alert: HighHttpLatency
        expr: |
          histogram_quantile(0.95,
            sum by (service_name, le) (rate(http_server_request_duration_seconds_bucket[5m])))
            > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 1s on {{ $labels.service_name }}"

      - alert: WorkerFailures
        expr: sum by (worker_name) (rate(app_worker_failures_total[5m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Background worker {{ $labels.worker_name }} is failing"

      - alert: RabbitMQProcessFailures
        expr: sum by (service_name) (rate(messaging_process_failures_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ consumer failures in {{ $labels.service_name }}"

      - alert: DeadLetteredMessages
        expr: increase(messaging_process_dead_lettered_total[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Messages are being dead-lettered"
